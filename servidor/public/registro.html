<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plataforma Local</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen w-screen flex items-center justify-center m-0 overflow-hidden">

    <!-- Contenedor principal con fondo verde -->
    <div class="bg-[#58A36F] w-11/12 max-w-5xl h-[80vh] rounded-xl flex flex-col md:flex-row items-center justify-around p-8 shadow-2xl relative">

        <!-- Lado izquierdo: Logo en círculo -->
        <div class="flex flex-col items-center justify-center mb-8 md:mb-0">
            <div class="w-48 h-48 md:w-64 md:h-64 rounded-full overflow-hidden shadow-lg border-4 border-white/20 flex items-center justify-center bg-white">
                <img src="https://lh3.googleusercontent.com/d/1JV4xacnadxWYIospvVzN3eNLbAf_wvTc" alt="Logo" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- Lado derecho: Tarjeta blanca del formulario -->
        <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-xl flex flex-col justify-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>
            
            <!-- Formulario -->
            <form action="plataforma.html" method="GET" class="space-y-5">
                
                <!-- Campo 1 -->
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Usuario o Correo</label>
                    <input type="text" required class="w-full bg-gray-200 border border-gray-300 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#58A36F]">
                </div>

                <!-- Campo 2 -->
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Contraseña</label>
                    <input type="password" required class="w-full bg-gray-200 border border-gray-300 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#58A36F]">
                </div>

                <!-- Botones inferiores -->
                <div class="flex gap-4 pt-2">
                    <button type="submit" class="flex-1 bg-[#58A36F] hover:bg-[#478559] text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-md text-center">
                        Entrar
                    </button>
                    
                    <a href="index.html" class="w-1/3 bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-center flex items-center justify-center">
                        Volver
                    </a>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
